# In our project, we have two services:
# - web – our Python Flask application.
# - db – our PostgreSQL database.
# Instead of manually creating and configuring two containers, Docker Compose does everything for us.
#
#
#
#
#
#
#
#
#
#
#
#
#
#
#
##



services:

  web:
    build: .
    container_name: flask_app
    ports:
      - "5000:5000"

    environment:
      DB_HOST: db
      DB_NAME: persondb
      DB_USER: postgres
      DB_PASSWORD: "123"
      DB_PORT: "5432"

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: postgres_db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123"
      POSTGRES_DB: persondb

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d persondb"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

volumes:
  postgres_data:
